name: zabbix-lab

services:
  postgres:
    image: postgres:${POSTGRES_TAG}
    container_name: zbx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [zbx-net]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZBX_SERVER_TAG}
    container_name: zbx-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_PROXYCONFIGFREQUENCY: 60   # envia config ao proxy passivo a cada 60s (padrao 3600)
    ports:
      - "10051:10051"
    networks: [zbx-net]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZBX_WEB_TAG}
    container_name: zbx-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PHP_TZ: ${PHP_TZ}
    ports:
      - "8080:8080"
    networks: [zbx-net]

  # ---------- Proxy ATIVO (o proxy conecta no server) ----------
  proxy-ativo:
    image: zabbix/zabbix-proxy-sqlite3:${ZBX_PROXY_ACTIVE_TAG}
    container_name: zbx-proxy-ativo
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_PROXYMODE: 0              # 0 = ativo, 1 = passivo
      ZBX_HOSTNAME: proxy-ativo     # tem que ser igual ao nome cadastrado no frontend
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - proxy-ativo-db:/var/lib/zabbix/db_data
    networks: [zbx-net]

  # ---------- Proxy PASSIVO (o server conecta no proxy) ----------
  proxy-passivo:
    image: zabbix/zabbix-proxy-sqlite3:${ZBX_PROXY_PASSIVE_TAG}
    container_name: zbx-proxy-passivo
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_PROXYMODE: 1
      ZBX_HOSTNAME: proxy-passivo
      ZBX_SERVER_HOST: zabbix-server   # IPs/hosts autorizados a conectar
    volumes:
      - proxy-passivo-db:/var/lib/zabbix/db_data
    networks: [zbx-net]

  # ---------- Agents monitorados via cada proxy ----------
  agent-a:
    image: zabbix/zabbix-agent2:${ZBX_AGENT_TAG}
    container_name: zbx-agent-a
    restart: unless-stopped
    depends_on: [proxy-ativo]
    environment:
      ZBX_HOSTNAME: agent-a
      ZBX_SERVER_HOST: proxy-ativo
    networks: [zbx-net]

  agent-p:
    image: zabbix/zabbix-agent2:${ZBX_AGENT_TAG}
    container_name: zbx-agent-p
    restart: unless-stopped
    depends_on: [proxy-passivo]
    environment:
      ZBX_HOSTNAME: agent-p
      ZBX_SERVER_HOST: proxy-passivo
    networks: [zbx-net]

  # =====================================================================
  # SIMULACAO DO AMBIENTE DE TRABALHO
  # Citrix -> Jenkins (bastion) -> ssh -> proxies instalados via pacote
  # ATENCAO: estes containers sao "VMs". Upgrades feitos via apt/dnf ficam
  # dentro do container. Recriar o container (build / --force-recreate)
  # equivale a reinstalar a VM do zero em 6.0.46.
  # =====================================================================
  jenkins:
    build: { context: ./vms, dockerfile: jenkins.Dockerfile }
    image: zbx-lab/jenkins-bastion
    container_name: zbx-jenkins
    hostname: jenkins
    restart: unless-stopped
    ports:
      - "2222:22"          # ssh -p 2222 ops@localhost  (senha: lab)
    networks: [zbx-net]

  proxy-ubuntu:
    build:
      context: ./vms
      dockerfile: ubuntu.Dockerfile
      args: { ZBX_VERSION: "6.0.46", PROXY_NAME: proxy-ubuntu, PROXY_MODE: "0" }
    image: zbx-lab/proxy-ubuntu
    container_name: zbx-proxy-ubuntu
    hostname: proxy-ubuntu
    restart: unless-stopped
    depends_on: [zabbix-server]
    networks: [zbx-net]

  proxy-oracle:
    build:
      context: ./vms
      dockerfile: oracle.Dockerfile
      args: { ZBX_VERSION: "6.0.46", PROXY_NAME: proxy-oracle, PROXY_MODE: "1" }
    image: zbx-lab/proxy-oracle
    container_name: zbx-proxy-oracle
    hostname: proxy-oracle
    restart: unless-stopped
    depends_on: [zabbix-server]
    networks: [zbx-net]

  agent-u:
    image: zabbix/zabbix-agent2:${ZBX_AGENT_TAG}
    container_name: zbx-agent-u
    restart: unless-stopped
    depends_on: [proxy-ubuntu]
    environment:
      ZBX_HOSTNAME: agent-u
      ZBX_SERVER_HOST: proxy-ubuntu
    networks: [zbx-net]

  agent-o:
    image: zabbix/zabbix-agent2:${ZBX_AGENT_TAG}
    container_name: zbx-agent-o
    restart: unless-stopped
    depends_on: [proxy-oracle]
    environment:
      ZBX_HOSTNAME: agent-o
      ZBX_SERVER_HOST: proxy-oracle
    networks: [zbx-net]

volumes:
  pgdata:
  proxy-ativo-db:
  proxy-passivo-db:

networks:
  zbx-net:
